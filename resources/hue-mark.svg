<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!--
    The Hue brand mark, ported verbatim from the hue-mobile adaptive icon so the
    desktop app and the Android app ship the identical logo. Sources:
      hue-mobile/app/src/main/res/drawable/ic_launcher_background.xml
      hue-mobile/app/src/main/res/drawable/ic_launcher_foreground.xml

    The gradient uses gradientUnits="userSpaceOnUse" with an explicit (0,0) ->
    (108,108) vector rather than the objectBoundingBox default, because the
    Android <gradient> specifies startX/startY/endX/endY in viewport units. Only
    the userSpaceOnUse form reproduces that corner-to-corner angle exactly.

    The corner radius is 20 to match HueShapes.Mark (20dp on the 108dp canvas).

    The "H" path data is copied character-for-character from the foreground
    drawable's android:pathData (Android path syntax is a subset of SVG's here).
    It is a real Bodoni Moda outline instanced at wght 700 / opsz 11 — the low
    optical size is deliberate, so the Didone hairlines stay thick enough to
    survive small renders such as the 16px tray icon. Do not re-derive it from a
    font or replace it with a text element.
  -->
  <defs>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#8FD3E8" />
      <stop offset="0.5" stop-color="#C9B8FF" />
      <stop offset="1" stop-color="#FFD9C7" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" rx="20" fill="url(#aurora)" />
  <path
    fill="#1F1730"
    d="M76.31,32L76.31,33.14L71.03,33.14L71.03,74.86L76.31,74.86L76.31,76L56.65,76L56.65,74.86L61.93,74.86L61.93,54.85L46.12,54.85L46.12,74.86L51.37,74.86L51.37,76L31.69,76L31.69,74.86L37,74.86L37,33.14L31.69,33.14L31.69,32L51.37,32L51.37,33.14L46.12,33.14L46.12,53.74L61.93,53.74L61.93,33.14L56.65,33.14L56.65,32Z"
  />
</svg>
