<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0c0d10" />
    <title>Hue — Phone Mirror</title>
    <style>
      :root {
        --bg: #0c0d10;
        --card: #16181d;
        --border: #262a32;
        --text: #e8eaef;
        --muted: #8b919d;
        --accent: #7aa5ff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
        gap: 12px;
        -webkit-text-size-adjust: 100%;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e0b341;
        flex: none;
      }
      .dot--ok {
        background: #4fc380;
      }
      .pill {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        text-transform: capitalize;
      }
      .block {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .block-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      #question {
        font-size: 15px;
        line-height: 1.45;
        color: var(--text);
      }
      .answer-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .answer-block .block-label {
        color: var(--accent);
      }
      #answer {
        font-size: 19px;
        line-height: 1.5;
        overflow-y: auto;
        flex: 1;
        white-space: pre-wrap;
        overscroll-behavior: contain;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .block {
          transition: opacity 200ms ease;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <span class="brand">Hue</span>
      <span class="pill" id="state">connecting</span>
    </header>

    <section class="block">
      <div class="block-label">Interviewer</div>
      <div id="question"><span class="empty">Waiting for a question…</span></div>
    </section>

    <section class="block answer-block">
      <div class="block-label">Suggested answer</div>
      <div id="answer"><span class="empty">Hue's answer will stream in here.</span></div>
    </section>

    <script>
      const $ = (id) => document.getElementById(id)
      const questionEl = $('question')
      const answerEl = $('answer')
      const stateEl = $('state')
      const dotEl = $('dot')

      // All payload text goes through textContent — never markup — so a
      // transcribed utterance can't inject anything into this page.
      function setText(el, text, emptyHint) {
        if (!text) {
          el.textContent = ''
          const hint = document.createElement('span')
          hint.className = 'empty'
          hint.textContent = emptyHint
          el.appendChild(hint)
        } else {
          el.textContent = text
        }
      }

      function reset() {
        setText(questionEl, '', 'Waiting for a question…')
        setText(answerEl, '', "Hue's answer will stream in here.")
      }

      const token = new URLSearchParams(location.search).get('t') || ''
      // EventSource reconnects on its own after drops (sleep, Wi-Fi blips).
      const es = new EventSource('/events?t=' + encodeURIComponent(token))

      es.onopen = () => {
        dotEl.classList.add('dot--ok')
        if (stateEl.textContent === 'connecting') stateEl.textContent = 'connected'
      }
      es.onerror = () => {
        dotEl.classList.remove('dot--ok')
        stateEl.textContent = 'reconnecting'
      }
      es.onmessage = (e) => {
        let ev
        try {
          ev = JSON.parse(e.data)
        } catch {
          return
        }
        if (ev.type === 'question') {
          setText(questionEl, ev.text, 'Waiting for a question…')
          setText(answerEl, '', 'Thinking…')
        } else if (ev.type === 'answer') {
          const stick =
            answerEl.scrollTop + answerEl.clientHeight >= answerEl.scrollHeight - 24
          setText(answerEl, ev.text, "Hue's answer will stream in here.")
          if (stick) answerEl.scrollTop = answerEl.scrollHeight
        } else if (ev.type === 'state') {
          stateEl.textContent = ev.text || 'connected'
        } else if (ev.type === 'clear') {
          reset()
        }
      }
    </script>
  </body>
</html>
