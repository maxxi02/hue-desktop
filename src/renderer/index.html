<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hue</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         wasm-unsafe-eval: ONNX Runtime / transformers.js / kokoro compile WebAssembly.
         worker-src blob:: those libraries spawn workers from blob URLs.
         connect-src huggingface.co: Whisper and Kokoro models download from the HF hub. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
